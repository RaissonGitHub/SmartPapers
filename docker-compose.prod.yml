services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartpapers_prod_db
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smartpapers_prod_backend
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: db
      HF_HOME: /var/lib/huggingface
    volumes:
      - hf_cache:/var/lib/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('localhost', 8000), 2); s.close()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    command: sh -c "python manage.py migrate --noinput && gunicorn backend.wsgi:application --config backend/gunicorn.conf.py"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
    container_name: smartpapers_prod_frontend
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache: