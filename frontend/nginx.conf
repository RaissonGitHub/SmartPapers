server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: "/" sempre serve o index.html do build.
    location = / {
        try_files /index.html =404;
    }

    # Assets com hash (chunk filenames) podem ficar expirados por muito tempo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualquer outro caminho que não seja um arquivo vai para o backend:
    # cobre /auth/, /artigos/, /chat/, /static/ e o admin com URL customizada
    # (DJANGO_ADMIN_URL) sem precisar listar os prefixos aqui.
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}